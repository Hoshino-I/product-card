<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Пользователи (async + LocalStorage)</title>
    <link rel="stylesheet" href="async.css">
  </head>
  <body>
    <div class="control">
      <button id="get-all-btn">Получить все карточки</button>
      <button id="delete-all-btn">Удалить все карточки</button>
    </div>

    <p id="status-message"></p>
    <div id="cards-container" class="cards-container"></div>
      <template id="user-card-template">
        <div class="card">
          <h3 class="user-name"></h3>
          <p class="user-age"></p>
          <p class="user-surname"></p>
          <p class="user-email"></p>
          <button class="delete-btn">Удалить</button>
        </div>
      </template>
    <script type="module" src="async.js"></script>
  </body>
</html>
